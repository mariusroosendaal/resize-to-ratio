<style>body {
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    button {
      border: none;
      background: #18A0FB;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #0D8CE6;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 16px;
    }
    p {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }</style><h2>Image Aspect Ratio Resizer</h2><p>Select objects with image fills and click the button below to resize them to match their original aspect ratios.</p><button id="resize">Resize Selected Images</button><script>// Listen for messages from the plugin code
    onmessage = event => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'get-image-dimensions') {
        // Create array buffer from the array
        const buffer = new Uint8Array(msg.imageData).buffer;
        
        // Create a blob from the array buffer
        const blob = new Blob([buffer]);
        const url = URL.createObjectURL(blob);
        
        // Create an image element to get the dimensions
        const img = new Image();
        img.onload = () => {
          // Send the dimensions back to the plugin
          parent.postMessage({
            pluginMessage: {
              type: 'image-dimensions',
              dimensions: {
                width: img.width,
                height: img.height
              }
            }
          }, '*');
          
          // Clean up
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }
    };
    
    document.getElementById('resize').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'resize-images' } }, '*');
    };</script>
